name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # contrôle hebdomadaire : lundi 06:00 UTC

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le style (Ruff)
        run: ruff check .

      - name: Exécuter les tests avec couverture
        run: >
          pytest -v
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=85
          --junitxml=junit.xml

      - name: Conserver les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-test
          path: |
            htmlcov/
            coverage.xml
            junit.xml
